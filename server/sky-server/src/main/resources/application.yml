server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sky-take-out
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sky_take_out}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

knife4j:
  enable: true
  setting:
    language: zh_cn

springfox:
  documentation:
    enabled: true
    swagger-ui:
      enabled: true

sky:
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET:sky-take-out-admin-secret-key-2026-change-me}
    user-secret-key: ${JWT_USER_SECRET:sky-take-out-user-secret-key-2026-change-me}
    admin-ttl: ${JWT_ADMIN_TTL:7200000}
    user-ttl: ${JWT_USER_TTL:7200000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET:sky-take-out}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}

logging:
  level:
    root: info
    com.sky.mapper: debug
